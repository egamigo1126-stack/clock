<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モノクロ時計</title>
<!-- PWA の設定: アプリの名前・アイコンなどは manifest.webmanifest に書いてある -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0c">
<!-- iPhone 用: ホーム画面のアイコンと、アドレスバーを消して起動する設定 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="時計">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@200;400&family=IBM+Plex+Mono:wght@200&family=JetBrains+Mono:wght@200&family=Roboto+Mono:wght@200&family=DM+Mono:wght@300&family=Space+Mono&family=Share+Tech+Mono&family=Orbitron:wght@400&family=Major+Mono+Display&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/* レイアウト: 画面いっぱいの「ステージ」1枚。真ん中にデジタル時計、下にボタン列 */
:root {
  --bg: #ffffff;        /* 背景 */
  --fg: #111111;        /* 時刻の文字 */
  --sub: #6b6e73;       /* 補助の文字（秒・日付） */
  --line: #d9dbde;      /* ボタン枠 */
  --accent: #111111;    /* 選択中ボタン */
  --accent-fg: #ffffff; /* 選択中ボタンの文字 */
  --font-num: "Chivo Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-ui: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --fg: #f2f2f2; --sub: #8d9096; --line: #2c2e31;
    --accent: #f2f2f2; --accent-fg: #0b0b0c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --fg: #f2f2f2; --sub: #8d9096; --line: #2c2e31;
  --accent: #f2f2f2; --accent-fg: #0b0b0c; color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  overflow: hidden;              /* 時計は1画面で完結させるのでスクロールなし */
  -webkit-tap-highlight-color: transparent;
}

/* ステージ: 時計とボタンをまとめた箱。強制回転のときはこの箱ごと90度回す */
.stage {
  position: fixed;
  top: 50%; left: 50%;
  width: 100%; height: 100%;
  transform: translate(-50%, -50%);
  display: grid;
  grid-template: 1fr / 1fr;      /* 1マスだけの格子。時計とボタン列を同じマスに重ねる */
  container-type: size;          /* 中の文字サイズを、この箱の大きさ基準（cq 単位）で決める */
  /* 上下は、スマホのノッチ（画面上部の切り欠き）やホームバーにかからないように空ける */
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.stage.rotated { transform: translate(-50%, -50%) rotate(90deg); }

/* 時計エリア: ステージ全体を使い、その真ん中に置く（ボタン列の高さに押し上げられない） */
.face {
  grid-area: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}

/* デジタル時計 */
.digital { text-align: center; min-width: 0; position: relative; }
.time {
  font-family: var(--font-num);
  font-weight: var(--num-weight, 200);   /* 太さはフォントごとに JavaScript で設定する */
  font-variant-numeric: tabular-nums;   /* 数字の幅をそろえて、秒が変わっても文字がぶれないようにする */
  line-height: 1;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.time .sec { color: var(--sub); }
.ampm { font-family: var(--font-num); color: var(--sub); }
/* 日付は時刻のすぐ下にぶら下げる。中央ぞろえの計算には入れないので、時刻の数字がちょうど画面の真ん中に来る */
.meta { position: absolute; top: 100%; left: 0; right: 0; }
.date { color: var(--sub); letter-spacing: 0.08em; margin-top: 0.8em; }
/* アラーム・タイマーの状態（日付の下に小さく出す） */
.status { color: var(--sub); font-family: var(--font-num); letter-spacing: 0.06em; margin-top: 0.5em; min-height: 1em; }
.status span + span { margin-left: 1.2em; }

/* 鳴っているときの画面（全面に「停止」ボタン）。点滅させて、音が出ない環境でも気づけるようにする */
.ring {
  grid-area: 1 / 1; z-index: 2;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  background: var(--bg); color: var(--fg);
  animation: blink 1s steps(1) infinite;
}
.ring.on { display: flex; }
.ring .ring-title { font-family: var(--font-num); font-size: min(12cqw, 18cqh); line-height: 1; }
.ring .ring-sub { color: var(--sub); font-size: 14px; letter-spacing: 0.08em; }
.ring button {
  font: 500 18px/1 var(--font-ui); letter-spacing: 0.1em;
  color: var(--accent-fg); background: var(--accent);
  border: 0; border-radius: 999px; padding: 18px 56px; cursor: pointer;
}
@keyframes blink { 50% { background: var(--fg); color: var(--bg); } }
@media (prefers-reduced-motion: reduce) { .ring { animation: none; } }

/* アラーム・タイマーの入力欄 */
.pick input[type="time"], .pick input[type="number"] {
  font: 500 12px/1 var(--font-ui); color: var(--fg); background: var(--bg);
  border: 0; padding: 8px 4px;
}
.pick input[type="number"] { width: 3.2em; text-align: right; }
.pick .mini {
  font: 500 12px/1 var(--font-ui); color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; cursor: pointer;
}
.pick .mini[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
/* 縦長は幅いっぱい、横長は高さも見て大きさを決める */
/* --clock-scale は「サイズ」のつまみの値（0.4〜1）。1 のときが画面に収まる最大の大きさ */
.stage.port .time { font-size: calc(20cqw * var(--clock-scale, 1)); }
.stage.land .time { font-size: calc(min(19cqw, 30cqh) * var(--clock-scale, 1)); }   /* 横長は高さが低いので、下のボタン列と重ならない大きさにする */
.stage.land .hint { display: none; }                 /* 横長はボタン列を低くするため、案内の一文を出さない */
.stage.land .controls { padding-top: 0; row-gap: 6px; }
.time .sec, .ampm { font-size: 0.42em; }
.date, .status { font-size: max(11px, calc(3.6cqmin * var(--clock-scale, 1))); }   /* 日付も時刻と一緒に大きさを変える */

/* 下のボタン列 */
.controls {
  grid-area: 1 / 1;              /* 時計と同じマスに重ね、下の端にそろえる */
  align-self: end;
  position: relative;            /* 時計より手前に表示する */
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 14px;
  padding-top: 10px;
  transition: opacity .25s;
}
.controls.hide { opacity: 0; pointer-events: none; }
/* 縦画面でボタン列が出ているときは、時計を上に寄せて、ボタンと重ならないようにする */
.stage.port:has(.controls:not(.hide)) .face { align-items: flex-start; padding-top: 14cqh; }
.stage.land:has(.controls:not(.hide)) .face { align-items: flex-start; padding-top: 0; }
.stage.land:has(.controls:not(.hide)) .time { font-size: calc(min(19cqw, 24cqh) * var(--clock-scale, 1)); }
.group { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.group button {
  font: 500 12px/1 var(--font-ui);
  color: var(--fg);
  background: transparent;
  border: 0;
  padding: 9px 12px;
  cursor: pointer;
  letter-spacing: 0.04em;
}
.group button + button { border-left: 1px solid var(--line); }
.group button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

/* フォント・日付の選択欄（項目が多いので、ボタンではなくプルダウンにする） */
.pick {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 0 4px 0 12px;
  font: 500 12px/1 var(--font-ui); color: var(--sub); letter-spacing: 0.04em;
}
.pick select {
  font: 500 12px/1 var(--font-ui); color: var(--fg);
  background: var(--bg); border: 0; border-radius: 999px;
  padding: 8px 6px; cursor: pointer; max-width: 46vw;
}
/* サイズのつまみ（スライダー） */
.pick.size { padding-right: 12px; }
.pick input[type="range"] { width: 110px; accent-color: var(--fg); cursor: pointer; }
.pick output { min-width: 3.2em; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
select:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.hint { width: 100%; text-align: center; font-size: 11px; color: var(--sub); }

@media (prefers-reduced-motion: reduce) { .controls { transition: none; } }
</style>
</head>
<body>

<div class="stage port" id="stage">
  <div class="face">
    <div class="digital">
      <div class="time" id="time" role="timer" aria-live="off">--:--<span class="sec">:--</span></div>
      <div class="meta">
        <div class="date" id="date">----</div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>

  <!-- 鳴っているときに全面に出す画面 -->
  <div class="ring" id="ring" role="alertdialog" aria-labelledby="ring-title">
    <div class="ring-title" id="ring-title">--:--</div>
    <div class="ring-sub" id="ring-sub">アラーム</div>
    <button type="button" id="ring-stop">停止</button>
  </div>

  <div class="controls" id="controls">
    <div class="group" role="group" aria-label="画面の向き">
      <button type="button" id="o-auto" data-orient="auto">自動</button>
      <button type="button" id="o-port" data-orient="port">縦</button>
      <button type="button" id="o-land" data-orient="land">横</button>
    </div>
    <div class="group" role="group" aria-label="時刻の表し方">
      <button type="button" id="f-24" data-fmt="24">24h</button>
      <button type="button" id="f-12" data-fmt="12">12h</button>
    </div>
    <div class="group" role="group" aria-label="画面の色">
      <button type="button" id="t-auto" data-theme-btn="auto">端末に合わせる</button>
      <button type="button" id="t-light" data-theme-btn="light">ホワイト</button>
      <button type="button" id="t-dark" data-theme-btn="dark">ダーク</button>
    </div>
    <label class="pick">フォント
      <select id="font-select"></select>
    </label>
    <label class="pick">日付
      <select id="date-select"></select>
    </label>
    <div class="pick">アラーム
      <input type="time" id="alarm-time" aria-label="アラームの時刻">
      <button type="button" class="mini" id="alarm-toggle" aria-pressed="false">オフ</button>
    </div>
    <div class="pick">タイマー
      <input type="number" id="timer-min" min="1" max="999" step="1" inputmode="numeric" aria-label="タイマーの分数">分
      <button type="button" class="mini" id="timer-btn">開始</button>
    </div>
    <label class="pick size">サイズ
      <input type="range" id="size-range" min="40" max="100" step="5" value="100">
      <output id="size-value" for="size-range">100%</output>
    </label>
    <div class="hint" id="hint">ボタンは 5 秒で自動で隠れます（時計をタップでまた表示）</div>
  </div>
</div>

<script>
// ---------- 設定（ブラウザに保存して、次に開いたときも同じにする） ----------
// 引数: なし / 戻り値: 保存済みの設定（なければ初期値）
function loadSettings() {
  // alarmOn: アラームのオン／オフ / alarmTime: 鳴らす時刻 "HH:MM" / alarmLastDay: 最後に鳴らした日（同じ日に2回鳴らさないため）
  // timerMin: タイマーの分数 / timerEnd: タイマーが終わる時刻（ミリ秒。0 なら止まっている）
  const defaults = { orient: "auto", fmt: "24", theme: "auto", font: "Chivo Mono", dateFmt: "slash", size: 100,
                     alarmOn: false, alarmTime: "07:00", alarmLastDay: "", timerMin: 3, timerEnd: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem("clock-settings") || "{}");
    return Object.assign(defaults, saved);
  } catch (e) {
    return defaults;   // 保存が使えない環境（プライベートウィンドウなど）でも動かす
  }
}
// 引数: settings（設定のオブジェクト） / 戻り値: なし
function saveSettings(settings) {
  try { localStorage.setItem("clock-settings", JSON.stringify(settings)); } catch (e) {}
}

const settings = loadSettings();
const stage = document.getElementById("stage");

// ---------- ホワイト／ダークの切り替え ----------
// 考え方:
//   <html> に data-theme="light" か "dark" を付けると、CSS の色（--bg など）がその色に切り替わる。
//   "auto" のときは data-theme を外し、端末（OS）の明るさ設定に合わせる。
// 引数: なし / 戻り値: なし
function applyTheme() {
  if (settings.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", settings.theme);
}
applyTheme();   // 最初の表示の前に色を決めておく

// ---------- フォントの切り替え ----------
// 候補の一覧。family: フォント名 / weight: 太さ（そのフォントで用意されている一番細いもの）
const FONTS = [
  { family: "Chivo Mono",         weight: 200 },
  { family: "IBM Plex Mono",      weight: 200 },
  { family: "JetBrains Mono",     weight: 200 },
  { family: "Roboto Mono",        weight: 200 },
  { family: "DM Mono",            weight: 300 },
  { family: "Space Mono",         weight: 400 },
  { family: "Share Tech Mono",    weight: 400 },
  { family: "Orbitron",           weight: 400 },
  { family: "Major Mono Display", weight: 400 },
];
// 保存されていたフォントが一覧にないとき（名前の変更など）は最初のものに戻す
if (!FONTS.some(f => f.family === settings.font)) settings.font = FONTS[0].family;

// 考え方: CSS の変数 --font-num（時刻と日付のフォント）と --num-weight（太さ）を書き換える
// 引数: なし / 戻り値: なし
function applyFont() {
  const f = FONTS.find(f => f.family === settings.font);
  const root = document.documentElement.style;
  root.setProperty("--font-num", `"${f.family}", ui-monospace, "SF Mono", Menlo, Consolas, monospace`);
  root.setProperty("--num-weight", f.weight);
}
applyFont();

// ---------- 時計のサイズ ----------
// 考え方: つまみの値（40〜100%）を 0.4〜1 の倍率にして、CSS の変数 --clock-scale に入れる。
//         CSS 側で「最大の大きさ × 倍率」を文字の大きさにしている。
const sizeRange = document.getElementById("size-range");
const sizeValue = document.getElementById("size-value");
// 引数: なし / 戻り値: なし
function applySize() {
  settings.size = Math.min(100, Math.max(40, Number(settings.size) || 100));   // 範囲外の値が保存されていても直す
  document.documentElement.style.setProperty("--clock-scale", settings.size / 100);
  sizeRange.value = settings.size;
  sizeValue.textContent = settings.size + "%";
}
applySize();

// ---------- 日付の表示形式 ----------
// id: 保存用の名前 / label: プルダウンに出す見本 / format: 日付 → 文字列に変える関数
const WEEK_EN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const WEEK_JA = ["日", "月", "火", "水", "木", "金", "土"];
const MONTH_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DATE_FORMATS = [
  { id: "slash", label: "2026/11/03 (Tue)",
    format: d => `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} (${WEEK_EN[d.getDay()]})` },
  { id: "ja",    label: "2026年11月3日（火）",
    format: d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WEEK_JA[d.getDay()]}）` },
  { id: "us",    label: "Tue, Nov 3, 2026",
    format: d => `${WEEK_EN[d.getDay()]}, ${MONTH_EN[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` },
  { id: "iso",   label: "2026-11-03",
    format: d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` },
];
if (!DATE_FORMATS.some(f => f.id === settings.dateFmt)) settings.dateFmt = DATE_FORMATS[0].id;

// プルダウンの中身を作り、今の設定を選んだ状態にする
const fontSelect = document.getElementById("font-select");
const dateSelect = document.getElementById("date-select");
FONTS.forEach(f => fontSelect.add(new Option(f.family, f.family)));
DATE_FORMATS.forEach(f => dateSelect.add(new Option(f.label, f.id)));
fontSelect.value = settings.font;
dateSelect.value = settings.dateFmt;

// ---------- 時刻を描く ----------
const timeEl = document.getElementById("time");
const dateEl = document.getElementById("date");
let lastSecond = -1;

// 引数: n（数値） / 戻り値: 2桁の文字列（例 7 → "07"）
const pad = n => String(n).padStart(2, "0");

// 引数: なし / 戻り値: なし（毎フレーム呼ばれて、秒が変わったときだけ数字を書き換える）
function tick() {
  const now = new Date();
  if (now.getSeconds() !== lastSecond) {
    lastSecond = now.getSeconds();
    let hours = now.getHours();
    let suffix = "";
    if (settings.fmt === "12") {
      suffix = hours < 12 ? "AM" : "PM";
      hours = hours % 12 || 12;              // 0時は12時と表示する
    }
    timeEl.innerHTML =
      `${settings.fmt === "12" ? hours : pad(hours)}:${pad(now.getMinutes())}` +
      `<span class="sec">:${pad(now.getSeconds())}</span>` +
      (suffix ? ` <span class="ampm">${suffix}</span>` : "");
    // 選ばれている表示形式で日付を書く
    dateEl.textContent = DATE_FORMATS.find(f => f.id === settings.dateFmt).format(now);
    checkAlarmAndTimer(now);   // 1 秒に 1 回、アラームとタイマーの時間が来たか調べる
  }
  requestAnimationFrame(tick);
}

// ---------- 縦・横の切り替え ----------
// 考え方:
//   画面そのものが横長か縦長か（screenIsLand）と、表示したい向き（want）を比べる。
//   違っていたら、ステージの幅と高さを入れ替えて 90 度回す。
//   これで、スマホの「画面回転ロック」がオンでも横向き表示にできる。
// 引数: なし / 戻り値: なし
function layout() {
  const W = document.body.clientWidth;
  const H = document.body.clientHeight;
  const screenIsLand = W > H;
  const want = settings.orient === "auto" ? (screenIsLand ? "land" : "port") : settings.orient;
  const rotate = (want === "land") !== screenIsLand;

  stage.style.width  = (rotate ? H : W) + "px";
  stage.style.height = (rotate ? W : H) + "px";
  stage.classList.toggle("rotated", rotate);
  stage.classList.toggle("land", want === "land");
  stage.classList.toggle("port", want === "port");
}

// ---------- ボタン ----------
// 引数: なし / 戻り値: なし（選ばれているボタンを黒く塗る）
function refreshButtons() {
  document.querySelectorAll("[data-orient]").forEach(b => b.setAttribute("aria-pressed", b.dataset.orient === settings.orient));
  document.querySelectorAll("[data-fmt]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fmt === settings.fmt));
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeBtn === settings.theme));
}

document.getElementById("controls").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.orient) settings.orient = b.dataset.orient;
  if (b.dataset.fmt)    settings.fmt = b.dataset.fmt;
  if (b.dataset.themeBtn) { settings.theme = b.dataset.themeBtn; applyTheme(); }
  lastSecond = -1;          // 12h/24h を変えたらすぐ数字を書き直す
  saveSettings(settings);
  refreshButtons();
  layout();
});

// プルダウンで選び直したとき
fontSelect.addEventListener("change", () => {
  settings.font = fontSelect.value;
  applyFont();
  saveSettings(settings);
});
dateSelect.addEventListener("change", () => {
  settings.dateFmt = dateSelect.value;
  lastSecond = -1;          // 次の描画で日付をすぐ書き直す
  saveSettings(settings);
});

// サイズのつまみ: 動かしている間はすぐ大きさを変え、指を離したら保存する
sizeRange.addEventListener("input", () => {
  settings.size = Number(sizeRange.value);
  applySize();
});
sizeRange.addEventListener("change", () => saveSettings(settings));

// 時計部分をタップ → ボタン列を隠す／出す
// ---------- 音を鳴らす（Web Audio） ----------
// Web Audio: ブラウザの中で音を作って鳴らす機能。音声ファイルがいらないので、電波がなくても鳴る。
// 注意: iPhone は「画面をタップしたとき」にしか音の再生を始めさせてくれない。
//       そのため、タップのたびに unlockAudio() を呼んで、音を出せる状態にしておく。
let audioCtx = null;
// 引数: なし / 戻り値: なし
function unlockAudio() {
  try {
    // iPhone のマナーモード（消音スイッチ）中でも鳴るようにする設定（対応している iOS だけ）
    if (navigator.audioSession) navigator.audioSession.type = "playback";
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
document.addEventListener("click", unlockAudio);
document.addEventListener("touchend", unlockAudio);

// 引数: なし / 戻り値: なし（「ピピピッ」を 1 回鳴らす。0.15 秒ずつ 3 回）
function beepOnce() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  for (let i = 0; i < 3; i++) {
    const osc = audioCtx.createOscillator();   // 音の波を作る部品
    const gain = audioCtx.createGain();        // 音量を変える部品
    osc.type = "square";
    osc.frequency.value = 1000;                // 1000Hz の「ピッ」という音
    gain.gain.setValueAtTime(0.25, t0 + i * 0.25);
    gain.gain.setValueAtTime(0, t0 + i * 0.25 + 0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0 + i * 0.25);
    osc.stop(t0 + i * 0.25 + 0.16);
  }
}

// ---------- 鳴っているときの画面 ----------
const ringEl = document.getElementById("ring");
let ringTimer = null;      // 音をくり返すタイマー
let ringAutoStop = null;   // 1 分で自動的に止めるタイマー
// 引数: title（大きく出す文字）, sub（その下の説明） / 戻り値: なし
function startRinging(title, sub) {
  document.getElementById("ring-title").textContent = title;
  document.getElementById("ring-sub").textContent = sub;
  ringEl.classList.add("on");
  stopSound();
  beepOnce();
  ringTimer = setInterval(beepOnce, 1000);           // 1 秒ごとに「ピピピッ」
  ringAutoStop = setTimeout(stopRinging, 60 * 1000); // 1 分たったら自動で止める
}
// 引数: なし / 戻り値: なし
function stopSound() {
  clearInterval(ringTimer);
  clearTimeout(ringAutoStop);
}
// 引数: なし / 戻り値: なし（音と画面を止める）
function stopRinging() {
  stopSound();
  ringEl.classList.remove("on");
}
document.getElementById("ring-stop").addEventListener("click", stopRinging);

// ---------- アラーム ----------
const alarmTimeEl = document.getElementById("alarm-time");
const alarmToggle = document.getElementById("alarm-toggle");
alarmTimeEl.value = settings.alarmTime;
// 引数: なし / 戻り値: なし（オン／オフのボタンの見た目を合わせる）
function refreshAlarm() {
  alarmToggle.setAttribute("aria-pressed", settings.alarmOn);
  alarmToggle.textContent = settings.alarmOn ? "オン" : "オフ";
  refreshStatus();
}
alarmToggle.addEventListener("click", () => {
  settings.alarmOn = !settings.alarmOn;
  settings.alarmLastDay = "";   // オンにし直したら、今日の分もまた鳴らせるようにする
  saveSettings(settings);
  refreshAlarm();
});
alarmTimeEl.addEventListener("change", () => {
  if (!alarmTimeEl.value) return;
  settings.alarmTime = alarmTimeEl.value;
  settings.alarmOn = true;      // 時刻を選んだら、自動でオンにする
  settings.alarmLastDay = "";
  saveSettings(settings);
  refreshAlarm();
});

// ---------- タイマー ----------
const timerMinEl = document.getElementById("timer-min");
const timerBtn = document.getElementById("timer-btn");
timerMinEl.value = settings.timerMin;
// 引数: なし / 戻り値: なし（開始／停止のボタンの見た目を合わせる）
function refreshTimer() {
  timerBtn.textContent = settings.timerEnd ? "停止" : "開始";
  timerBtn.setAttribute("aria-pressed", !!settings.timerEnd);
  refreshStatus();
}
timerBtn.addEventListener("click", () => {
  if (settings.timerEnd) {
    settings.timerEnd = 0;      // 動いていれば止める
  } else {
    const min = Math.min(999, Math.max(1, Math.round(Number(timerMinEl.value) || 3)));
    timerMinEl.value = settings.timerMin = min;
    settings.timerEnd = Date.now() + min * 60 * 1000;   // 終わる時刻 = 今 + 分数
  }
  saveSettings(settings);
  refreshTimer();
});

// ---------- 日付の下の状態表示 ----------
const statusEl = document.getElementById("status");
// 引数: なし / 戻り値: なし（「⏰ 07:00」「残り 2:59」を書く）
function refreshStatus() {
  const parts = [];
  if (settings.alarmOn) parts.push(`アラーム ${settings.alarmTime}`);
  if (settings.timerEnd) {
    const left = Math.max(0, Math.ceil((settings.timerEnd - Date.now()) / 1000));   // 残りの秒数
    const h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = left % 60;
    parts.push(`タイマー 残り ${h ? h + ":" + pad(m) : m}:${pad(s)}`);
  }
  statusEl.innerHTML = parts.map(p => `<span>${p}</span>`).join("");
}

// 引数: now（今の日時） / 戻り値: なし（tick() から 1 秒に 1 回呼ばれる）
function checkAlarmAndTimer(now) {
  // アラーム: 時刻が一致して、今日まだ鳴らしていなければ鳴らす
  const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const today = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
  if (settings.alarmOn && hm === settings.alarmTime && settings.alarmLastDay !== today) {
    settings.alarmLastDay = today;
    saveSettings(settings);
    startRinging(settings.alarmTime, "アラーム");
  }
  // タイマー: 終わる時刻を過ぎたら鳴らす
  if (settings.timerEnd && Date.now() >= settings.timerEnd) {
    settings.timerEnd = 0;
    saveSettings(settings);
    refreshTimer();
    startRinging(`${settings.timerMin}分`, "タイマー終了");
  }
  refreshStatus();
}

refreshAlarm();
refreshTimer();

// ---------- ボタン列を自動で隠す ----------
// 考え方:
//   - ボタン列を出してから 5 秒、何も触らなければ自動で隠す
//   - ボタン列を触っている間（ボタン・つまみ・プルダウン）は、そのたびに 5 秒を数え直す
//   - プルダウンを開いている最中は隠さない（選んでいる途中で消えないように）
//   - 隠れているときに時計をタップすると、また出てくる
const controlsEl = document.getElementById("controls");
const AUTO_HIDE_MS = 5000;   // 自動で隠れるまでの時間（ミリ秒。5000 = 5 秒）
let hideTimer = null;

// 引数: なし / 戻り値: なし（5 秒後に隠す予約をし直す）
function scheduleHide() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    // プルダウン・時刻・分数を入力している最中なら、もう 5 秒待つ
    if (document.activeElement && document.activeElement.matches("select, input[type=time], input[type=number]")) {
      scheduleHide();
      return;
    }
    controlsEl.classList.add("hide");
  }, AUTO_HIDE_MS);
}
// 引数: なし / 戻り値: なし（ボタン列を出して、5 秒後に隠す予約をする）
function showControls() {
  controlsEl.classList.remove("hide");
  scheduleHide();
}
// ボタン列を触ったら、5 秒を数え直す
["pointerdown", "input", "change", "focusin"].forEach(type =>
  controlsEl.addEventListener(type, scheduleHide)
);
scheduleHide();   // 開いた直後はボタン列を出しておき、5 秒後に隠す

// 時計部分をタップ → 隠れていれば出す／出ていればすぐ隠す
document.querySelector(".face").addEventListener("click", () => {
  if (controlsEl.classList.contains("hide")) showControls();
  else { clearTimeout(hideTimer); controlsEl.classList.add("hide"); }
});

// ---------- 画面を消さない（Wake Lock） ----------
// Wake Lock: ブラウザに「この画面をスリープさせないで」と頼む仕組み。
// 考え方:
//   - iPhone は、画面をタップしたときに頼まないと断ることがある → タップのたびに頼み直す
//   - 途中で iPhone 側に解除されることがある → 解除されたら、すぐ頼み直す
//   - 効いているかどうかを、ボタン列の下の一文に表示する
let wakeLock = null;
const hintEl = document.getElementById("hint");

// 引数: on（true: 効いている / false: 効いていない / null: 未対応） / 戻り値: なし
function showWakeState(on) {
  const state = on === null ? "この端末では未対応（設定の自動ロックを「なし」に）"
              : on ? "オン" : "オフ（画面をタップするとオン）";
  hintEl.textContent = `ボタンは 5 秒で自動で隠れます（時計をタップでまた表示） ／ 画面スリープ防止：${state}`;
}

// 引数: なし / 戻り値: なし
async function keepAwake() {
  if (!("wakeLock" in navigator)) { showWakeState(null); return; }
  if (wakeLock && !wakeLock.released) return;          // すでに効いていれば何もしない
  if (document.visibilityState !== "visible") return;  // 画面に出ていないときは頼めない
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    showWakeState(true);
    // iPhone 側に解除されたら、表示をオフにして頼み直す
    wakeLock.addEventListener("release", () => {
      showWakeState(false);
      setTimeout(keepAwake, 1000);
    });
  } catch (e) {
    showWakeState(false);   // 断られた（低電力モードなど）。次のタップでまた頼む
  }
}
// 別のアプリから戻ってきたとき・画面をタップしたときに頼み直す
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("click", keepAwake);
document.addEventListener("touchend", keepAwake);

// スマホを回したとき・ウィンドウの大きさが変わったときに並べ直す
window.addEventListener("resize", layout);

refreshButtons();
layout();
keepAwake();
requestAnimationFrame(tick);

// ---------- PWA: Service Worker を登録する ----------
// Service Worker（sw.js）は、ページのファイルをスマホの中に保存して、電波がなくても開けるようにするプログラム。
// HTTPS のページ（または PC 上の localhost）でしか動かないので、使えない環境では何もしない。
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
